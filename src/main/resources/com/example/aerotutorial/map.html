<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>AeroSafe Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        #map { height: 100%; width: 100%; }
    </style>
</head>
<body>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>

    var map = L.map('map').setView([23.8103, 90.4125], 12); // Dhaka by default


    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);


    var javaAppReady = false;
    var checkInterval = setInterval(function() {
        if ((window.app && typeof window.app.onMapClick === 'function') ||
            (window.adminApp && typeof window.adminApp.onAlertMapClick === 'function')) {
            javaAppReady = true;
            console.log("✓ Java bridge connected successfully!");
            clearInterval(checkInterval);
        }
    }, 100);


    setTimeout(function() {
        clearInterval(checkInterval);
        if (!javaAppReady) {
            console.error("Java bridge failed to connect after 10 seconds");
        }
    }, 10000);


    map.on('click', function(e) {
        var lat = e.latlng.lat;
        var lon = e.latlng.lng;
        var cityName = "Selected Location";


        var maxRetries = 3;
        var retryCount = 0;

        function tryCallJava() {

            if (window.adminApp && typeof window.adminApp.onAlertMapClick === 'function') {
                try {
                    window.adminApp.onAlertMapClick(cityName, lat, lon);
                    console.log("✓ Alert location selected: " + lat + ", " + lon);
                    return true;
                } catch (err) {
                    console.error("Error calling admin Java method: " + err);
                }
            }


            if (window.app && typeof window.app.onMapClick === 'function') {
                try {
                    window.app.onMapClick(cityName, lat, lon);
                    console.log("✓ Map clicked: " + lat + ", " + lon);
                    return true;
                } catch (err) {
                    console.error("Error calling Java method: " + err);
                    return false;
                }
            }

            if (retryCount < maxRetries) {
                retryCount++;
                console.log("Retry " + retryCount + ": Java app not ready, waiting...");
                setTimeout(tryCallJava, 200);
                return false;
            } else {
                console.error("Java app method not found after " + maxRetries + " retries!");
                return false;
            }
        }

        tryCallJava();
    });
</script>
</body>
</html>
